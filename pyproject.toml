[tool.poetry]
name = "catkin"
version = "0.1.0"
description = "simple auth server for quart"
authors = ["Tyler Matteson <tyler@agritheory.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
asyncpg = "^0.29.0"
jinja2 = "^3.1.0"
cryptography = "^43.0.3"
databases = {extras = ["asyncpg"], version = "^0.9.0"}
pyjwt = "^2.9.0"
environs = "^11.0.0"
quart = "^0.19.8"
quart-cors = "^0.7.0"
strawberry-graphql = {extras = ["debug-server"], version = "^0.247.1"}
uvicorn = "^0.32.0"


[tool.poetry.scripts]
start = "catkin.src.app:main"
serve = "uvicorn catkin.src.app:app --host 0.0.0.0 --port 5000 --reload"
# init-db = "scripts.init_db:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

